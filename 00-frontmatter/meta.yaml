# Deck metadata. pandoc reads this through defaults.yaml; nothing here is section specific.
title: "Python: From chaos to simple, one bit at a time"
subtitle: "or what I should have known from the start"
author: "Dimitar Popchev"
institute: "DEV.BG Python user group, online"
date: "2026-11-05"
# Slide language. Switch to bg-BG together with the slide text; the fonts below cover Cyrillic,
# and `make ascii` then needs --skip-slides (see the ascii target in mk/deck.mk).
lang: en-US
aspectratio: 169
theme: default
fontsize: 10pt
mainfont: "Adwaita Sans"
sansfont: "Adwaita Sans"
# Adwaita Sans is a variable font with no bold shape by name: \textbf falls back to regular
# (Font shape TU/AdwaitaSans(0)/b/n undefined). Select the bold instance on the wght axis.
# Raw latex spans keep pandoc from escaping the braces.
mainfontoptions:
  - "`BoldFont={*}`{=latex}"
  - "`BoldFeatures={RawFeature={+axis={wght=700}}}`{=latex}"
sansfontoptions:
  - "`BoldFont={*}`{=latex}"
  - "`BoldFeatures={RawFeature={+axis={wght=700}}}`{=latex}"
monofont: "Adwaita Mono"
monofontoptions:
  - Scale=0.85
colorlinks: true
