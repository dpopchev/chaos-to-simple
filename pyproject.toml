# pyproject.toml at the HELPER level (rules/python.md -> Levels): the repository
# keeps tracked python helpers under scripts/utils/ and ships no python. uv
# manages the local .venv from this file; nothing is built.

[project]
name = "chaos-to-simple"
version = "0"
description = "Slides and tested snippets for the DEV.BG talk: Python, from chaos to simple, one bit at a time"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "pyright>=1.1",
  "matplotlib>=3.9",
  "seaborn>=0.13.2",
]

# ---------------------------------------------------------------------------
# Tools -- configured here, never in scattered rc files.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# The helpers' tests sit under scripts/; each section that carries code adds its
# tests directory. Sections without code (02, 03, 07) are absent on purpose.
testpaths = ["scripts", "01-bits/tests", "04-what/tests", "05-how/tests", "06-simple/tests"]
pythonpath = [".", "01-bits", "04-what", "05-how", "06-simple"]
# importlib: test basenames may repeat across directories; helpers still import
# by module name through `pythonpath`.
addopts = "-ra --doctest-modules --import-mode=importlib --strict-markers"
# Every test carries exactly one category marker (conftest.py, rules/python.md Tests).
markers = [
  "edge: primitives to domain types and back; an adapter against a local resource",
  "model: an aggregate's rules and moves; a value object's constructor",
  "command: load-change-save with injected load, save and find",
  "view: a query or projection over primitives",
  "functional: the work item's criterion",
  "integration: the real external system; never in make test or make check",
]
# Tool residuals live in local/; tools without a pyproject key are pointed
# there by mk/python.mk's exports.
cache_dir = "local/.pytest_cache"
# Every run appends its test durations here; `make test-stats` reports them.
stats_file = "local/test-stats.jsonl"

[tool.coverage.run]
data_file = "local/.coverage"

[tool.ruff]
line-length = 100
target-version = "py314"
src = [".", "01-bits", "04-what", "05-how", "06-simple"]
extend-exclude = ["build", "local", "templates"]
cache-dir = "local/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
include = ["scripts", "01-bits", "04-what", "05-how", "06-simple"]
extraPaths = [".", "01-bits", "04-what", "05-how", "06-simple"]
exclude = ["**/__pycache__", ".venv", "build", "local"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
